name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: bridge/target
          key: cargo-${{ runner.os }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Bridge tests
        run: cargo test --release
        working-directory: bridge

      - name: Build bridge (release)
        run: cargo build --release
        working-directory: bridge

      - name: Refresh bundled bridge exe
        shell: pwsh
        run: Copy-Item bridge/target/release/codebridge-bridge.exe desktop/resources/bridge/codebridge-bridge.exe -Force

      - name: Fetch opencode binary (v2.0.31, from npm)
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "opencode-src"
          New-Item -ItemType Directory -Force $dest | Out-Null
          npm install --prefix $dest --no-audit --no-fund @opencode/cli-windows-x64@2.0.31
          $src = Join-Path $dest "node_modules\@opencode\cli-windows-x64\bin\opencode.exe"
          New-Item -ItemType Directory -Force desktop/resources/opencode | Out-Null
          Copy-Item $src desktop/resources/opencode/opencode.exe -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      - name: Syntax check main/preload/frontend
        shell: pwsh
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/vite.config.mts
          node --check desktop/tailwind.config.js
          node --check desktop/postcss.config.js

      - name: Testpages DOM contract regression
        run: node scripts/testpages-check.mjs

      - name: Packaging sanity (electron-builder --dir)
        run: npm run dist -- --dir
        working-directory: desktop
