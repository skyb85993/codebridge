name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: bridge/target
          key: cargo-${{ runner.os }}-${{ hashFiles('bridge/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build bridge (release)
        run: cargo build --release
        working-directory: bridge

      - name: Refresh bundled bridge exe
        shell: pwsh
        run: Copy-Item bridge/target/release/codebridge-bridge.exe desktop/resources/bridge/codebridge-bridge.exe -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm ci
        working-directory: desktop

      # 서명 인증서가 있으면(secrets: WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD) electron-builder가 자동 서명.
      # 없으면 기존처럼 무서명 빌드 (SmartScreen 경고는 유지).
      - name: Enable signing when certificate is present
        shell: pwsh
        run: |
          if ("${{ secrets.WIN_CSC_LINK }}" -ne "") {
            "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build installer
        run: npm run dist -- --publish never
        working-directory: desktop

      - name: Extract release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $cl = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = "(?ms)^## $([regex]::Escape($version)).*?(?=^## |\z)"
          $match = [regex]::Match($cl, $pattern)
          if ($match.Success) {
            $notes = $match.Value.Trim()
          } else {
            $notes = "CodeBridge $version"
          }
          [System.IO.File]::WriteAllText("$env:RUNNER_TEMP/release-notes.md", $notes)

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag --title "CodeBridge $tag" --notes-file "$env:RUNNER_TEMP/release-notes.md" `
            "desktop/dist/CodeBridge-Setup-*.exe" `
            "desktop/dist/latest.yml" `
            "desktop/dist/CodeBridge-Setup-*.exe.blockmap"
