<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatGPT (CodeBridge testpage)</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #212121; color: #ececec; height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 16px; border-bottom: 1px solid #3a3a3a; display: flex; align-items: center; gap: 8px; }
    button { font: inherit; color: inherit; background: #3a3a3a; border: 0; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
    button:hover { background: #4a4a4a; }
    #messages { flex: 1; overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .DilResponseRoot { background: #2f2f2f; border-radius: 12px; padding: 12px 16px; max-width: 720px; white-space: pre-wrap; }
    .DilResponseRoot pre { background: #181818; border: 1px solid #3a3a3a; border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; }
    .composer-row { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #3a3a3a; }
    textarea#prompt-textarea { flex: 1; min-height: 44px; background: #2f2f2f; color: inherit; border: 1px solid #4a4a4a; border-radius: 12px; padding: 10px 12px; resize: vertical; font: inherit; }
    #stop-button { background: #7a2020; }
    #alert-banner { display: none; background: #5a1f1f; border: 1px solid #a33; color: #ffc9c9; padding: 10px 14px; border-radius: 8px; margin: 12px 16px 0; }
    #alert-banner.shown { display: block; }
  </style>
</head>
<body>
  <header>
    <button aria-label="새 채팅" id="new-chat-button">✎ 새 채팅</button>
    <span>CodeBridge Testpage — <code id="mode-label">fixture</code></span>
  </header>
  <div id="alert-banner" role="alert">rate limit reached. Please try again later.</div>
  <div id="messages"></div>
  <form class="composer-row" action="#" onsubmit="return false">
    <textarea id="prompt-textarea" data-id="root" placeholder="메시지를 입력하세요…"></textarea>
    <button type="button" id="send-button" data-testid="send-button" aria-label="보내기">↑</button>
    <button type="button" id="stop-button" data-testid="stop-button" aria-label="Stop generating" style="display:none">■</button>
  </form>
  <script>
    const params = new URLSearchParams(location.search);
    const mode = params.get('mode') || 'fixture';
    document.getElementById('mode-label').textContent = mode;
    const FIXTURE_FILE = `-- path: ServerScriptService/GameManager.lua
-- CodeBridge regression fixture (fake ChatGPT response)
local Players = game:GetService("Players")
local GameManager = {}
GameManager.score = 0

function GameManager:start()
    GameManager.score = 0
end

return GameManager
`;

    const messages = document.getElementById('messages');
    const stopBtn = document.getElementById('stop-button');
    const sendBtn = document.getElementById('send-button');
    const composer = document.getElementById('prompt-textarea');
    let streamTimer = null;

    function appendAssistant(text) {
      const root = document.createElement('div');
      root.className = 'DilResponseRoot entity-prose-inset';
      root.textContent = text;
      messages.appendChild(root);
      messages.scrollTop = messages.scrollHeight;
      return root;
    }

    function showLimit() {
      document.getElementById('alert-banner').classList.add('shown');
      composer.disabled = true;
      sendBtn.disabled = true;
    }

    function finishGeneration() {
      stopBtn.style.display = 'none';
      sendBtn.style.display = 'inline-block';
    }

    function streamResponse(root, full, chunkSize, intervalMs, done) {
      stopBtn.style.display = 'inline-block';
      sendBtn.style.display = 'none';
      let i = 0;
      streamTimer = setInterval(() => {
        i = Math.min(full.length, i + chunkSize);
        root.textContent = full.slice(0, i);
        messages.scrollTop = messages.scrollHeight;
        if (i >= full.length) {
          clearInterval(streamTimer);
          streamTimer = null;
          finishGeneration();
          if (done) done(root);
        }
      }, intervalMs);
    }

    function send() {
      if (composer.disabled) return;
      if (!composer.value.trim()) return;
      const prompt = composer.value;
      composer.value = '';
      const root = appendAssistant('');
      if (mode === 'limit') {
        showLimit();
        root.textContent = '(한도 배너 모드: 답이 오지 않습니다)';
        return;
      }
      if (mode === 'truncated') {
        // 잘린 응답 시뮬레이션: 파일의 절반만 출력하고 종료
        streamResponse(root, FIXTURE_FILE.slice(0, Math.floor(FIXTURE_FILE.length / 2)), 17, 20, () => {
          root.textContent += '\n\n(잘림)';
        });
        return;
      }
      // fixture: 전체 파일을 스트리밍 출력 후 <pre>로 교체 렌더
      stopBtn.style.display = 'inline-block';
      sendBtn.style.display = 'none';
      let i = 0;
      const step = () => {
        i = Math.min(FIXTURE_FILE.length, i + 29);
        const done = i >= FIXTURE_FILE.length;
        if (done) {
          const pre = document.createElement('pre');
          pre.textContent = FIXTURE_FILE;
          root.textContent = '';
          root.appendChild(pre);
          finishGeneration();
        } else {
          root.textContent = FIXTURE_FILE.slice(0, i);
          setTimeout(step, 12);
        }
      };
      step();
    }

    sendBtn.addEventListener('click', send);
    composer.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    stopBtn.addEventListener('click', () => {
      if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
      finishGeneration();
    });
    document.getElementById('new-chat-button').addEventListener('click', () => {
      messages.innerHTML = '';
      document.getElementById('alert-banner').classList.remove('shown');
      composer.disabled = false;
      sendBtn.disabled = false;
      composer.value = '';
    });
    if (mode === 'limit') showLimit();
  </script>
</body>
</html>
